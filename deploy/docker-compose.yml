name: sharetrip-notification

services:
  postgres:
    image: postgres:16
    container_name: sharetrip-notification-postgres
    environment:
      POSTGRES_DB: sharetrip_notification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "6545:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
